[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dyreview"
version = "1.0.0"
description = "仁维 Crabot Skill：客户抖音账号后台数据采集与自动复盘"
requires-python = ">=3.10"
dependencies = [
  "psycopg[binary]>=3.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
crypto = ["cryptography>=42"]
dev = ["pytest>=8"]

[project.scripts]
dyreview = "dyreview.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
